spring.application.name=kotlin-api

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/jobmining_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:jobmining_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:secret_password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Python API Configuration
python.api.url=${PYTHON_API_URL:http://localhost:8000}

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
